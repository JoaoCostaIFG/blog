name: Get Blog contents from Joplin

on:
  workflow_dispatch:

env:
  NOTEBOOK_NAME: Blog
  OUTPUT_DIR: .

permissions:
  contents: read

concurrency:
  group: "joplin"
  cancel-in-progress: true

jobs:
  build:
    name: Export and Publish Blog Contents
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit and push the exported blog posts
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          # cache: "npm"
          # cache-dependency-path: deps/joplin_exporter/package-lock.json
      - name: Netbird Connect
        id: netbird
        uses: Alemiz112/netbird-connect@fbea46300ca7ee907ff7d8e39ede3f556a6ecf10 # v1.0.2
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          hostname: "blog-joplin-job"
          management-url: "https://vpn.joaocosta.dev"

      - name: Install joplin_exporter dependencies
        working-directory: deps/joplin_exporter
        # Installs joplin (pinned in the submodule's package-lock.json).
        # allowScripts in package.json lets sqlite3/sharp/keytar run their
        # install scripts (blocked by default on npm >= 12).
        run: npm ci

      - name: Login and sync Joplin Wiki notebook
        env:
          JOPLIN_PATH: ${{ secrets.JOPLIN_PATH }}
          JOPLIN_USER: ${{ secrets.JOPLIN_USER }}
          JOPLIN_PASSWORD: ${{ secrets.JOPLIN_PASSWORD }}
        run: |
          tmp="$(mktemp -d)"
          # Run from the exporter dir so 'npx joplin' resolves its local install
          (cd deps/joplin_exporter && ./export_joplin.sh "$NOTEBOOK_NAME" "$tmp" --optimize-images)
          ls -la "$tmp/$NOTEBOOK_NAME"
          rm -rf "$OUTPUT_DIR/posts" "$OUTPUT_DIR/public/_resources"
          mv "$tmp/$NOTEBOOK_NAME" "$OUTPUT_DIR/posts"
          mv "$tmp/_resources" "$OUTPUT_DIR/public/_resources"
          rm -rf "$tmp"

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          # Check if there are any changes in the output directory
          git add "$OUTPUT_DIR/posts" "$OUTPUT_DIR/public/_resources"
          if ! git diff --staged --quiet --exit-code "$OUTPUT_DIR"; then
            echo "Changes detected in $OUTPUT_DIR. Committing..."
            git commit -m "Update Joplin export: $NOTEBOOK_NAME ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
            auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push
          else
            echo "No changes to commit in $OUTPUT_DIR."
          fi
